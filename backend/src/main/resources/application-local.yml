# 本地真实联调配置。
# 目标：默认走百炼兼容 OpenAI 接口，而不是 mock AI。

spring:
  ai:
    openai:
      api-key: ${AI_BAILIAN_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen-plus}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v4}
  mail:
    host: smtp.qq.com
    port: 465
    username: 3030256102@qq.com
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.starttls.enable]": true

ai:
  openai:
    mock-enabled: false
    api-key: ${AI_BAILIAN_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    model: ${OPENAI_MODEL:qwen-plus}

rag:
  enabled: ${RAG_ENABLED:true}

speech:
  asr:
    enabled: ${ASR_ENABLED:true}
    api-key: ${ASR_API_KEY:${AI_BAILIAN_API_KEY:${OPENAI_API_KEY:}}}
  tts:
    enabled: ${TTS_ENABLED:true} #TODO: 已接入，关掉是省token
    api-key: ${TTS_API_KEY:${AI_BAILIAN_API_KEY:${OPENAI_API_KEY:}}}


auth:
  mail:
    from: 3030256102@qq.com
    startup-check-enabled: ${SMTP_STARTUP_CHECK_ENABLED:true} # 启动时检查

app:
  cors:
    # 本地真实联调时临时放开公网来源，便于 cpolar 测试；测试结束后应收紧。
    allowed-origin-patterns: "*"

admin:
  security:
    accounts:
      - username: admin
        password-hash: "$2a$10$AZEfkMhBEM7LuF0GbTWZnOoyX0Ic4dfm7XtCz.IIGYmcAislxa6vy"
        display-name: "本地管理员"
