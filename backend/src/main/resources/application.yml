# 公共基础配置。
# 所有环境共享默认值；不要在这里写死 spring.profiles.active。
spring:

  application:
    name: ai_interview-backend

  # 文件上传配置：默认限制较小，简历文件可能包含大量文本或图片，因此放宽限制
  # 单个文件最大 1MB 可能不够，尤其是 PDF 简历可能包含图片，放宽到 20MB
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL_ENABLE:false}
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  # Spring AI official config (consumed by spring-ai-starter-model-openai)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-mock}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7


  # Qdrant 向量数据库配置（被 spring-ai-qdrant-store 自动读取）
  # 当 RagConfiguration 检测到 rag.enabled=true 时才会初始化连接，否则跳过相关 Bean

server:
  port: 8080
  servlet:
    context-path: /api/v1

# JWT 配置：密钥和过期时间，生产环境应通过环境变量注入
jwt:
  secret: ${JWT_SECRET:ai_interview-dev-secret-key-at-least-32-bytes-long}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

admin:
  security:
    accounts: []

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.a05.aiinterview.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    org.springframework.ai: DEBUG
    root: INFO
    com.a05.aiinterview: DEBUG

interview:
  debug:
    enabled: ${INTERVIEW_DEBUG_ENABLED:false}
    include-prompts: ${INTERVIEW_DEBUG_INCLUDE_PROMPTS:false}
    max-text-chars: ${INTERVIEW_DEBUG_MAX_TEXT_CHARS:1200}

# 简历文件上传目录配置，默认使用系统临时目录，生产环境建议配置固定路径
resume:
  upload-dir: ${RESUME_UPLOAD_DIR:${java.io.tmpdir}/aiinterview-resumes}

# AI 调用配置
# mock-enabled=true 时使用 MockAiClient 返回硬编码结果，无需 API Key
# mock-enabled=false 时使用 OpenAiClient 调用真实 AI（通过 Spring AI），需要配置 OPENAI_API_KEY 等变量
ai:
  openai:
    mock-enabled: ${AI_MOCK_ENABLED:true}
    # 以下配置仅在 mock-enabled=false 时生效，用于 OpenAiClient 调用真实 AI
    api-key: ${OPENAI_API_KEY:sk-mock}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  prompt:
    version:
      planner: ${AI_PROMPT_PLANNER_VERSION:v2}
      question-generation-stream: ${AI_PROMPT_QUESTION_GENERATION_STREAM_VERSION:v1}
      evaluation-decision: ${AI_PROMPT_EVALUATION_DECISION_VERSION:v2}
      report-generation: ${AI_PROMPT_REPORT_GENERATION_VERSION:v1}
      intro-rewrite: ${AI_PROMPT_INTRO_REWRITE_VERSION:v1}
      question-detail-evaluation: ${AI_PROMPT_QUESTION_DETAIL_EVALUATION_VERSION:v1}

# RAG 配置
# rag.enabled=true 时会初始化 Qdrant 向量库连接和检索服务
# 若未启用，相关 Bean 不会加载，避免启动时报错（Qdrant 未部署）
rag:
  enabled: ${RAG_ENABLED:false}
  top-k: ${RAG_TOP_K:5}
  min-score: ${RAG_MIN_SCORE:0.65}
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: ${QDRANT_COLLECTION:interview_knowledge}
  initialize-schema: true
  # init-sample-data=true 时会在启动时向 Qdrant 插入示例知识条目（仅用于开发测试）
  init-sample-data: ${RAG_INIT_SAMPLE:false}

# SSE 流式生成配置
# generation-cache-ttl-seconds: Redis 缓存 delta 块和 done 状态的过期时间
#   - 用于断点续传：客户端重连时可以从缓存恢复已生成的内容
#   - 避免无限期占用 Redis 内存，默认 1800s = 30 分钟
# follow.poll-interval-ms: 尾随回放轮询间隔（毫秒）
# follow.idle-timeout-seconds: 尾随等待超时（秒）
sse:
  #TODO 生成缓存过期时间（秒），默认 300s
  generation-cache-ttl-seconds: ${SSE_CACHE_TTL:1800}
  follow:
    #TODO 尾随回放轮询间隔（毫秒），默认 250ms
    poll-interval-ms: ${SSE_FOLLOW_POLL_INTERVAL_MS:250}
    #TODO 尾随等待超时（秒），默认 30s
    idle-timeout-seconds: ${SSE_FOLLOW_IDLE_TIMEOUT_SECONDS:30}

# 语音服务配置（ASR + TTS）
# asr.enabled=false 时跳过语音识别服务初始化，相关 Bean 不加载
speech:
  asr:
    enabled: ${ASR_ENABLED:false}
    provider: alibaba
    api-key: ${ASR_API_KEY:${OPENAI_API_KEY:sk-mock}}
    endpoint: ${ASR_ENDPOINT:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
    model: ${ASR_MODEL:paraformer-realtime-v2}
    # 不同题型的停顿检测阈值（毫秒），超时未说话则自动提交答案
    token-ttl-seconds: ${ASR_TOKEN_TTL:900}
    pause-threshold-config:
      INTRO: 20000
      PRINCIPLE: 20000
      SCENARIO: 20000
      PROJECT_DEEP_DIVE: 20000
      BEHAVIORAL: 20000
  tts:
    enabled: ${TTS_ENABLED:false}
    provider: alibaba
    api-key: ${TTS_API_KEY:${OPENAI_API_KEY:sk-mock}}
    endpoint: ${TTS_ENDPOINT:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
    model: ${TTS_MODEL:cosyvoice-v1}
    voice: ${TTS_VOICE:longxiaochun}
    #TODO 语音缓存过期时间（秒），默认 3600s = 1 小时
    cache-ttl-seconds: ${TTS_CACHE_TTL:3600}
    #TODO 语音合成超时（毫秒），默认 10s
    timeout-ms: ${TTS_TIMEOUT_MS:10000}

auth:
  mail:
    from: ${SMTP_FROM:}
    startup-check-enabled: ${SMTP_STARTUP_CHECK_ENABLED:true}
